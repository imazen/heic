[package]
name = "heic-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared types and traits for the heic decoder backends (HevcBackend trait, DecodedFrame, color conversion)"
keywords = ["heic", "heif", "hevc", "image", "decoder"]
categories = ["multimedia::images"]

[features]
default = []
std = ["archmage/std"]
fallible-alloc = []

[dependencies]
enough = { workspace = true }
whereat = { workspace = true }
archmage = { version = "0.9.16", default-features = false, features = ["macros"] }
magetypes = { version = "0.9.16", default-features = false }
safe_unaligned_simd = "0.2.5"

[lints.rust]
unsafe_code = "forbid"
# `deny`, not `warn`: CI's clippy jobs check the root `heic` package, and
# `-D warnings` there does not reach a dependency's own compilation, so a
# `warn` here was never actually enforced for anyone. `[lints]` applies to this
# package however it is built -- including as a dependency of the backend
# crates -- so `deny` is the only level that gates the public surface. (#22)
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
