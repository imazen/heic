[package]
name = "heic-backend-d3d11va"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows Direct3D 11 Video Acceleration (D3D11VA) HEVC decoder backend for the heic crate"
keywords = ["heic", "heif", "hevc", "d3d11va", "windows"]
categories = ["multimedia::images", "os::windows-apis"]

[features]
default = []

[dependencies]
heic-core = { workspace = true, features = ["std"] }
enough = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_Foundation",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
