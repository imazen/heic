[workspace]
members = [
    ".",
    "heic-core",
    "heic-backend-mediafoundation",
    "heic-backend-videotoolbox",
    "heic-backend-mediacodec",
    "heic-backend-vaapi",
    "heic-backend-d3d11va",
]
# The public-API snapshot runner (depends on zenutils-apidoc) is NOT a
# workspace member: plain `cargo test` and CI never build it. Regenerate
# via `just api-doc` (= `cargo test --manifest-path apidoc/Cargo.toml`).
exclude = ["apidoc"]
resolver = "3"

[workspace.package]
# Bumped together for every workspace release — `scripts/release.sh`
# expects a single source of truth here so a workspace publish only
# needs ONE version bump. See RELEASING.md for the full flow.
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
repository = "https://github.com/imazen/heic"
authors = ["Imazen LLC"]

[workspace.dependencies]
heic-core = { version = "0.2.0", path = "heic-core" }
enough = "0.4.3"
whereat = "0.1.5"

[package]
name = "heic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure Rust HEIC/HEIF image decoder with SIMD acceleration"
repository.workspace = true
readme = "README.crates.md"
keywords = ["heic", "heif", "hevc", "image", "decoder"]
categories = ["multimedia::images", "parser-implementations"]
include = [
    "/src/**",
    "/examples/**",
    "/README.crates.md",
    "/CHANGELOG.md",
    "/LICENSE*",
]
autoexamples = false

[features]
# DEFAULT IS EMPTY. The crate requires at least one HEVC backend feature to
# compile; default `cargo build` emits a `compile_error!` from src/lib.rs. See
# the README for the available backends and their target_os requirements.
default = []

# Dev-only: enables archmage/testable_dispatch so benches/tier_isolation.rs can
# disable the baseline SIMD token (NEON on aarch64) and measure a real scalar
# arm. Never enable in a published build.
_dev = ["archmage/testable_dispatch"]

# ── HEVC backend selection ────────────────────────────────────────────────
# Every build must enable at least one backend whose target_os matches the
# host. Native backends ship as separate workspace member crates and are
# pulled in as optional deps; the parent feature wires the dep on and is
# the user-facing knob.
#
# Backends compose: enable as many as you want. At decode time, pass an
# ordered allowlist to `DecoderConfig::with_backends(&[...])`; the first
# entry that reports available wins, with `BackendError::Unavailable` /
# `BackendError::Decode` falling through to the next.
#
# As of this commit only `backend-rust` is wired into the parent
# dispatcher (and only `backend-mediafoundation` has a real FFI body).
# Selecting a native backend feature compiles the corresponding subcrate
# but the decode pipeline doesn't yet route through it — that plumbing
# lands in a follow-up PR. Until then, native-feature builds will
# fall through to `backend-rust` at decode time.
backend-rust = []
backend-mediafoundation = ["std", "dep:heic-backend-mediafoundation"]
backend-videotoolbox = ["std", "dep:heic-backend-videotoolbox"]
backend-mediacodec = ["std", "dep:heic-backend-mediacodec"]
backend-vaapi = ["std", "dep:heic-backend-vaapi"]
backend-d3d11va = ["std", "dep:heic-backend-d3d11va"]

# ── Cross-cutting flags ──────────────────────────────────────────────────
std = ["archmage/std", "heic-core/std", "ultrahdr-core?/std"]
fallible-alloc = []
parallel = ["std", "dep:rayon"]
zencodec = [
    "std",
    "dep:zencodec",
    "dep:zenpixels",
    "dep:rgb",
    "dep:imgref",
    "dep:garb",
    "dep:bytemuck",
    "dep:ultrahdr-core",
]
av1 = ["std", "dep:rav1d-safe"]
unci = ["dep:zenflate"]

[dependencies]
heic-core = { workspace = true }
heic-backend-mediafoundation = { version = "0.2.0", path = "heic-backend-mediafoundation", optional = true }
heic-backend-videotoolbox = { version = "0.2.0", path = "heic-backend-videotoolbox", optional = true }
heic-backend-mediacodec = { version = "0.2.0", path = "heic-backend-mediacodec", optional = true }
heic-backend-vaapi = { version = "0.2.0", path = "heic-backend-vaapi", optional = true }
heic-backend-d3d11va = { version = "0.2.0", path = "heic-backend-d3d11va", optional = true }
enough = "0.4.3"
whereat = { version = "0.1.5"}
archmage = { version = "0.9.16", default-features = false, features = ["macros"] }
magetypes = { version = "0.9.16", default-features = false }
safe_unaligned_simd = "0.2.5"
memchr = { version = "2.8.0", default-features = false }
rayon = { version = "1.11.0", optional = true }
zencodec = { version = ">=0.1.26, <0.3.0", optional = true }
zenpixels = { version = ">=0.2.11, <0.4.0", default-features = false, features = ["rgb", "imgref"], optional = true }
rgb = { version = "0.8.53", default-features = false, features = ["as-bytes"], optional = true }
bytemuck = { version = "1.21", default-features = false, features = ["extern_crate_alloc"], optional = true }
imgref = { version = "1.12.0", optional = true }
garb = { version = "0.2.5", default-features = false, optional = true }
rav1d-safe = { version = "0.5.3", optional = true, default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
zenflate = { version = "0.3.4", optional = true, default-features = false }
ultrahdr-core = { version = "0.6.0", optional = true, default-features = false, features = ["f16"] }

[dev-dependencies]
zenbench = "0.1.9"
criterion = { version = "0.8.2", default-features = false, features = ["plotters", "cargo_bench_support"] }
fast-ssim2 = { version = "0.8.0", features = ["imgref"] }
imgref = "1.12.0"
# Perceptual cross-backend RGBA comparison for the dispatcher integration
# tests — zensim does multi-scale XYB similarity scoring; zensim-regress
# wraps it with structured tolerance / report semantics for diff testing.
# The coordinated media series uses a frozen Profile-A judge with only the
# PNG dependency range widened (zensim#63); its scoring implementation is
# unchanged from 8462c. This pin also admits the shared zenpixels 0.3 types.
zensim = { version = "0.3.0", git = "https://github.com/imazen/zensim", rev = "8557758809156baba7364bd8cfe32889a61da4e8" }
zensim-regress = { version = "0.4.0", git = "https://github.com/imazen/zensim", rev = "8557758809156baba7364bd8cfe32889a61da4e8" }
# heic-wasm-rs: reference decoder for comparison tests
# Uncomment + RUSTFLAGS='--cfg heic_reference' cargo test to enable
# heic-wasm-rs = { path = "../../heic/heic-wasm-rs" }
png = "0.18.1"
# zencodec conformance harness (crates.io). Provides
# `check_decode_truncation_series` (a truncated input must categorize as an
# incomplete-input ErrorCategory, never panic, never silently decode).
#
# Unification caveat: the *published* `zencodec-testkit 0.1.0` manifest declares
# `zencodec ^0.1.26` = `>=0.1.26, <0.2.0`. That intersects the `zencodec` dep
# above on a single registry instance today, so no [patch.crates-io] is needed.
# But once `zencodec 0.2.0` publishes, testkit 0.1.0's caret will NOT admit it
# and this dev-dep graph would carry TWO zencodec copies. `zencodec-testkit`
# must republish with the widened `>=0.1.26, <0.3.0` requirement (already in its
# manifest, zencodec repo `4391021`) BEFORE zencodec 0.2.0 ships.
zencodec-testkit = ">=0.1.0, <0.3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(heic_reference)', 'cfg(fuzzing)'] }

[profile.release]
lto = "thin"
codegen-units = 1

