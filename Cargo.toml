[package]
name = "heic"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
description = "Pure Rust HEIC/HEIF image decoder with SIMD acceleration"
repository = "https://github.com/imazen/heic"
keywords = ["heic", "heif", "hevc", "image", "decoder"]
categories = ["multimedia::images", "parser-implementations"]
exclude = [
    "CLAUDE.md",
    "FEEDBACK.md",
    "CABAC-DEBUG-HANDOFF.md",
    "heaptrack.*",
    "examples/batch_test.rs",
    "examples/compare_support.rs",
    "examples/compare_yuv.rs",
    "examples/debug_edges.rs",
    "examples/debug_qp.rs",
    "examples/decode_trace.rs",
    "examples/dump_container.rs",
    "examples/dump_hevc.rs",
    "examples/extract_hevc.rs",
    "examples/test_all.rs",
    "tests/compare_reference.rs",
    "tests/trace_bad_pixel.rs",
    "benches/compare.rs",
]

[features]
default = ["std"]
std = ["archmage/std"]
parallel = ["std", "dep:rayon"]
zencodec = ["dep:zencodec", "dep:zenpixels", "dep:rgb", "dep:imgref", "dep:garb"]
# zennode = ["dep:zennode", "zencodec"]

[dependencies]
enough = "0.4.3"
whereat = "0.1.5"
archmage = { version = "0.9.15", default-features = false, features = ["macros"] }
safe_unaligned_simd = "0.2.5"
rayon = { version = "1.11.0", optional = true }
zencodec = { version = "0.1.9", optional = true }
zenpixels = { version = "0.2.1", default-features = false, features = ["rgb", "imgref"], optional = true }
rgb = { version = "0.8.53", default-features = false, features = ["as-bytes"], optional = true }
imgref = { version = "1.12.0", optional = true }
garb = { version = "0.2.5", default-features = false, optional = true }
# zennode = { path = "../zennode/zennode", optional = true, default-features = false, features = ["derive"] }

[dev-dependencies]
criterion = "0.8.2"
fast-ssim2 = { version = "0.7.1", features = ["imgref"] }
imgref = "1.12.0"
# heic-wasm-rs = { path = "../../heic/heic-wasm-rs" } # local-only, not published
png = "0.18.1"

[profile.release]
lto = "thin"
codegen-units = 1

[[bench]]
name = "decode"
harness = false

# compare bench requires heic-wasm-rs (local-only, excluded from publish)
# [[bench]]
# name = "compare"
# harness = false
