[[bench]]
name = "decode"
harness = false

# compare bench requires heic-wasm-rs (uncomment dep + this entry to use)
# [[bench]]
# name = "compare"
# harness = false



# ultrahdr-core 0.5.0 on crates.io predates the Apple MakerNote HDR-headroom
# parser (parse_exif_for_apple_hdr / from_apple_headroom) that ReconstructHdr
# needs. Patch to the imazen/ultrahdr rev that carries it until the next
# ultrahdr-core release; remove this section and bump the version req then.
# A git (not path) patch keeps CI and fresh clones working with no sibling
# checkouts.
[patch.crates-io]
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "3ac20f99d45e985e09f274fc07181b238385e703" }
# TEMP: until zencodec 0.1.26 ships (PR #103) — pulls the CategorizedError /
# ErrorCategory taxonomy this crate now implements. Remove and bump the
# `zencodec` dependency to the released version once 0.1.26 is published.
zencodec = { git = "https://github.com/imazen/zencodec", branch = "cancellation-classification-99" }

[[example]]
name = "gm20_probe"
required-features = ["backend-rust"]
