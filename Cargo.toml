[package]
name = "heic"
version = "0.1.4"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
description = "Pure Rust HEIC/HEIF image decoder with SIMD acceleration"
repository = "https://github.com/imazen/heic"
keywords = ["heic", "heif", "hevc", "image", "decoder"]
categories = ["multimedia::images", "parser-implementations"]
include = [
    "/src/**",
    "/tests/**",
    "/testdata/**",
    "/fuzz/regression/**",
    "/benches/**",
    "/examples/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE*",
]
autoexamples = false

[features]
default = ["std"]
std = ["archmage/std", "ultrahdr-core?/std"]
fallible-alloc = []
parallel = ["std", "dep:rayon"]
zencodec = ["dep:zencodec", "dep:zenpixels", "dep:rgb", "dep:imgref", "dep:garb", "dep:bytemuck", "dep:ultrahdr-core"]
av1 = ["std", "dep:rav1d-safe"]
unci = ["dep:zenflate"]

[dependencies]
enough = "0.4.3"
whereat = { version = "0.1.5"}
archmage = { version = "0.9.16", default-features = false, features = ["macros"] }
magetypes = { version = "0.9.16", default-features = false }
safe_unaligned_simd = "0.2.5"
memchr = { version = "2.8.0", default-features = false }
rayon = { version = "1.11.0", optional = true }
zencodec = { version = "0.1.19", optional = true }
zenpixels = { version = "0.2.10", default-features = false, features = ["rgb", "imgref"], optional = true }
rgb = { version = "0.8.53", default-features = false, features = ["as-bytes"], optional = true }
bytemuck = { version = "1.21", default-features = false, features = ["extern_crate_alloc"], optional = true }
imgref = { version = "1.12.0", optional = true }
garb = { version = "0.2.5", default-features = false, optional = true }
rav1d-safe = { version = "0.5.3", optional = true, default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
zenflate = { version = "0.3.4", optional = true, default-features = false }
ultrahdr-core = { version = "0.4.1", optional = true, default-features = false }

[dev-dependencies]
criterion = "0.8.2"
fast-ssim2 = { version = "0.8.0", features = ["imgref"] }
imgref = "1.12.0"
# heic-wasm-rs: reference decoder for comparison tests
# Uncomment + RUSTFLAGS='--cfg heic_reference' cargo test to enable
# heic-wasm-rs = { path = "../../heic/heic-wasm-rs" }
png = "0.18.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(heic_reference)', 'cfg(fuzzing)'] }

[profile.release]
lto = "thin"
codegen-units = 1

# Only auto-discover examples that don't need heic-wasm-rs
[[example]]
name = "decode"
[[example]]
name = "bin_trace_emit"
[[example]]
name = "dump_hevc"
[[example]]
name = "compare_yuv"
# batch_test and compare_support need API/dep fixes, excluded for now
[[example]]
name = "debug_edges"
[[example]]
name = "debug_qp"
[[example]]
name = "decode_trace"
[[example]]
name = "dump_container"
[[example]]
name = "extract_hevc"
[[example]]
name = "test_all"
[[example]]
name = "bench_parse_annexb"
# compare_support requires heic-wasm-rs (uncomment dep + add [[example]] to use)

[[bench]]
name = "decode"
harness = false

