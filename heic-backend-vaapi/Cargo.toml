[package]
name = "heic-backend-vaapi"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Linux VA-API (libva) HEVC decoder backend for the heic crate"
keywords = ["heic", "heif", "hevc", "vaapi", "linux"]
categories = ["multimedia::images"]

[features]
default = []

[dependencies]
heic-core = { workspace = true, features = ["std"] }
enough = { workspace = true }

# `libloading` lets us dlopen libva.so.2 + libva-drm.so.2 at runtime.
# Using a runtime-loaded probe (rather than link-time `libva-sys` or
# pkg-config `cros-libva`) keeps the build clean on systems without
# `libva-dev` — the backend reports `Unavailable` instead of failing
# to compile.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.9.0"
libc = "0.2.158"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
