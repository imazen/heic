name: Fuzz

on:
  push:
    branches: [main]
  schedule:
    # Nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Seconds per fuzz target'
        required: false
        default: '300'

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_probe
          - fuzz_decode
          - fuzz_hevc_raw
          - fuzz_decode_av1
          - fuzz_decode_unci
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}
          cache-directories: fuzz/target

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Determine duration
        id: duration
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "seconds=300" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "seconds=${{ github.event.inputs.duration || '300' }}" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=60" >> "$GITHUB_OUTPUT"
          fi

      - name: Seed corpus from regression tests
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cp fuzz/regression/* fuzz/corpus/${{ matrix.target }}/ 2>/dev/null || true

      - name: Fuzz ${{ matrix.target }} (${{ steps.duration.outputs.seconds }}s)
        run: |
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} \
            -- -max_total_time=${{ steps.duration.outputs.seconds }} \
               -dict=fuzz/heif.dict \
               -rss_limit_mb=2048 \
               -jobs=1
        env:
          # Pin seed for reproducibility within a commit
          FUZZ_SEED: ${{ github.sha }}

      - name: Check for crashes
        if: failure()
        run: |
          echo "::error::Fuzzer ${{ matrix.target }} found crashes"
          ls -la fuzz/artifacts/${{ matrix.target }}/ 2>/dev/null || true
          for f in fuzz/artifacts/${{ matrix.target }}/crash-*; do
            [ -f "$f" ] || continue
            echo "--- $(basename $f) ($(wc -c < $f) bytes) ---"
            xxd "$f" | head -5
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30

  regression:
    name: Fuzz regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run regression seeds
        run: cargo test --all-features --test fuzz_regression
