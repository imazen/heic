name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test (backend-rust + std)
        run: cargo test --lib --features "backend-rust,std"

      - name: Test (backend-rust + parallel)
        run: cargo test --lib --features "backend-rust,parallel"

      - name: Check (backend-rust, no_std)
        run: cargo check --no-default-features --features backend-rust

      - name: Default build must fail with the compile_error message
        shell: bash
        run: |
          set -e
          if cargo build --no-default-features 2>build.log; then
            echo "::error::Expected compile_error but build succeeded"
            cat build.log
            exit 1
          fi
          if ! grep -q "no HEVC backend is enabled" build.log; then
            echo "::error::compile_error message did not match expected text"
            cat build.log
            exit 1
          fi

  feature-perms:
    name: Feature permutations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check (backend-rust, no_std)
        run: cargo check --no-default-features --features backend-rust

      - name: Test (backend-rust + parallel)
        run: cargo test --lib --features "backend-rust,parallel"

      - name: Test (backend-rust + zencodec)
        run: cargo test --lib --features "backend-rust,zencodec"

      - name: Test (backend-rust + parallel + zencodec)
        run: cargo test --lib --features "backend-rust,parallel,zencodec"

      - name: Test (all publishable features)
        run: cargo test --lib --features "backend-rust,std,fallible-alloc,parallel,zencodec"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy (backend-rust + parallel)
        run: cargo clippy --lib --features "backend-rust,parallel" -- -D warnings

      - name: Clippy (backend-rust + zencodec)
        run: cargo clippy --lib --features "backend-rust,zencodec" -- -D warnings

      - name: Clippy (all publishable features)
        run: cargo clippy --lib --features "backend-rust,std,fallible-alloc,parallel,zencodec" -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo hack check --rust-version

  i686:
    name: Test (i686)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-i686

      - name: Test (i686)
        run: cross test --lib --features "backend-rust,std" --target i686-unknown-linux-gnu

  backend-mediafoundation:
    # Cross-compile-check the heic-backend-mediafoundation crate for Windows
    # targets. Runtime / decode tests await the parent-crate wiring + a
    # Windows runner with HEVC Video Extensions installed (see spec.md).
    name: backend-mediafoundation (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: backend-mediafoundation-${{ matrix.target }}
      - name: Build heic-backend-mediafoundation
        run: cargo build -p heic-backend-mediafoundation --target ${{ matrix.target }}
      - name: Clippy heic-backend-mediafoundation
        run: cargo clippy -p heic-backend-mediafoundation --target ${{ matrix.target }} -- -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2

      - name: Generate coverage
        run: cargo llvm-cov --lib --features "backend-rust,std" --lcov --output-path lcov.info

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
