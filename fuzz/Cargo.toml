[package]
name = "heic-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Detach from the parent `heic` workspace. cargo-fuzz expects to
# build fuzz/ as an independent crate (so it can swap sanitizer
# RUSTFLAGS without contaminating the rest of the workspace's
# build), but cargo errors out if a sub-Cargo.toml sits inside a
# workspace it isn't a member of. Declaring an empty workspace
# here decouples them — same pattern used by zenwebp/fuzz and
# zenavif-parse/fuzz.
[workspace]
members = ["."]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zencodec = { git = "https://github.com/imazen/zencodec", rev = "1fb997bb88e7405e6a315bf1f0b22f71e99be272" }

[dependencies.heic]
path = ".."
# `backend-rust` satisfies the HEVC-backend `compile_error!` gate in
# `heic::lib`. `av1` enables the AVIF/AV1 fuzz target; `unci` enables
# the uncompressed-codec target.
features = ["backend-rust", "av1", "unci", "inventory"]

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_target_1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_limits"
path = "fuzz_targets/fuzz_decode_limits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_probe"
path = "fuzz_targets/fuzz_probe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_av1"
path = "fuzz_targets/fuzz_decode_av1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_unci"
path = "fuzz_targets/fuzz_decode_unci.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_hevc_raw"
path = "fuzz_targets/fuzz_hevc_raw.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_color_transform"
path = "fuzz_targets/fuzz_color_transform.rs"
test = false
doc = false
bench = false

[patch.crates-io]
# Standalone roots must repeat the parent family's patches.
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "1fb997bb88e7405e6a315bf1f0b22f71e99be272" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "fde59b96632557592cffa9b7301acd8db96ed078" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "fde59b96632557592cffa9b7301acd8db96ed078" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "1fb997bb88e7405e6a315bf1f0b22f71e99be272" }

linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "52896f4b24664315586bd60e5f048253b1f69052" }

garb = { git = "https://github.com/imazen/garb", rev = "605276d717ea0b31a1cd2a36ae05301383c7b8b5" }

zentone = { git = "https://github.com/imazen/zentone", rev = "4b5ab710157743e3018b7de3a79f336c2f61113e" }

[[bin]]
name = "fuzz_inventory"
path = "fuzz_targets/fuzz_inventory.rs"
test = false
doc = false
bench = false
