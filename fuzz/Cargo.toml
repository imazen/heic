[package]
name = "heic-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Detach from the parent `heic` workspace. cargo-fuzz expects to
# build fuzz/ as an independent crate (so it can swap sanitizer
# RUSTFLAGS without contaminating the rest of the workspace's
# build), but cargo errors out if a sub-Cargo.toml sits inside a
# workspace it isn't a member of. Declaring an empty workspace
# here decouples them — same pattern used by zenwebp/fuzz and
# zenavif-parse/fuzz.
[workspace]
members = ["."]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.heic]
path = ".."
# `backend-rust` satisfies the HEVC-backend `compile_error!` gate in
# `heic::lib`. `av1` enables the AVIF/AV1 fuzz target; `unci` enables
# the uncompressed-codec target.
features = ["backend-rust", "av1", "unci", "zencodec"]

# The `inventory` target drives the zencodec trait.
[dependencies.zencodec]
version = ">=0.1.27, <0.3.0"

# This crate is its own workspace, so the parent's patches do not apply.
# TEMPORARY: the zencodec entry follows imazen/zencodec#133 (branch
# `feat/inventory`); swap for the released version before merge.
# ultrahdr-core mirrors the parent's rev pin (needed by the `zencodec` feature).
[patch.crates-io]
zencodec = { git = "https://github.com/imazen/zencodec", branch = "feat/inventory" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "3ac20f99d45e985e09f274fc07181b238385e703" }

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_target_1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_limits"
path = "fuzz_targets/fuzz_decode_limits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_probe"
path = "fuzz_targets/fuzz_probe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_av1"
path = "fuzz_targets/fuzz_decode_av1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_unci"
path = "fuzz_targets/fuzz_decode_unci.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_hevc_raw"
path = "fuzz_targets/fuzz_hevc_raw.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_color_transform"
path = "fuzz_targets/fuzz_color_transform.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inventory"
path = "fuzz_targets/fuzz_inventory.rs"
test = false
doc = false
bench = false
