[package]
name = "heic-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Detach from the parent `heic` workspace. cargo-fuzz expects to
# build fuzz/ as an independent crate (so it can swap sanitizer
# RUSTFLAGS without contaminating the rest of the workspace's
# build), but cargo errors out if a sub-Cargo.toml sits inside a
# workspace it isn't a member of. Declaring an empty workspace
# here decouples them — same pattern used by zenwebp/fuzz and
# zenavif-parse/fuzz.
[workspace]
members = ["."]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zencodec = ">=0.2.0, <0.3.0"

[dependencies.heic]
path = ".."
# `backend-rust` satisfies the HEVC-backend `compile_error!` gate in
# `heic::lib`. `av1` enables the AVIF/AV1 fuzz target; `unci` enables
# the uncompressed-codec target.
features = ["backend-rust", "av1", "unci", "inventory"]

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_target_1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_limits"
path = "fuzz_targets/fuzz_decode_limits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_probe"
path = "fuzz_targets/fuzz_probe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_av1"
path = "fuzz_targets/fuzz_decode_av1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_unci"
path = "fuzz_targets/fuzz_decode_unci.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_hevc_raw"
path = "fuzz_targets/fuzz_hevc_raw.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_color_transform"
path = "fuzz_targets/fuzz_color_transform.rs"
test = false
doc = false
bench = false

# Standalone roots must repeat the parent family pins.
[patch.crates-io]
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "42a0c5c83c5c418950eb528d92d57788f6700bcf" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "42a0c5c83c5c418950eb528d92d57788f6700bcf" }
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "037ef59b57ae003f853a5b6624b173edfee22d6a" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "037ef59b57ae003f853a5b6624b173edfee22d6a" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "607614ce9b1027edac600b52e61c99fe18f5cb46" }

[[bin]]
name = "fuzz_inventory"
path = "fuzz_targets/fuzz_inventory.rs"
test = false
doc = false
bench = false
